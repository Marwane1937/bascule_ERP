<div class="container py-4">
  <div class="page-inner">

    <!-- En-tête -->
    <div class="page-header mb-4">
      <h3 class="fw-bold text-dark">Base</h3>
      <ul class="breadcrumbs d-flex align-items-center">
        <li class="nav-home me-2"><a href="#"><i class="fas fa-home text-primary"></i></a></li>
        <li class="separator mx-1 text-muted"><i class="fas fa-chevron-right small"></i></li>
        <li class="nav-item me-2"><a href="#" class="text-muted">Famille</a></li>
        <li class="separator mx-1 text-muted"><i class="fas fa-chevron-right small"></i></li>
        <li class="nav-item fw-semibold text-muted">Liste Familles</li>
      </ul>
    </div>

    <!-- Bouton Ajouter Famille -->
    <div class="row mb-4">
      <div class="col-12 text-end">
        <button type="button" class="btn btn-gradient px-4 py-2 shadow-sm" (click)="openAddModal()">
          <i class="fas fa-plus me-2"></i> Ajouter une Famille
        </button>
      </div>
    </div>

    <!-- Modal Formulaire d'ajout client -->
    <div class="modal fade" id="addClientModal" tabindex="-1" aria-labelledby="addClientModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-elegant shadow">
          <div class="modal-header modal-header-custom">
            <h5 class="modal-title text-white" id="addClientModalLabel">
              {{ isEditMode ? '✏️ Modifier Famille' : '➕ Nouvelle Famille' }}
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="Code" class="form-label">Code <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="Code" placeholder="Ex: 1"
                    [(ngModel)]="currentFamille.code" name="code" [disabled]="isEditMode" />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="name" class="form-label">Nom <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="name" placeholder="Ex: Famille produits"
                    [(ngModel)]="currentFamille.nom" name="nom" />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer bg-light border-top">
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
            <button class="btn btn-success" (click)="saveFamille()">
              {{ isEditMode ? '💾 Modifier' : '✅ Enregistrer' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tableau Client -->
    <div class="row">
      <div class="col-md-12">
        <div class="card border-0 shadow-sm rounded-3">

          <div class="card-body">
            <div class="table-responsive">
              <div *ngIf="loading" class="text-center my-4">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Chargement...</span>
                </div>
              </div>

              <table *ngIf="!loading" id="clientTable" class="display table table-bordered table-striped" width="100%">
                <thead>
                  <tr>
                    <th style="width: 70px;">Code Famille</th>
                    <th style="width: 130px;">Désignation</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody>
                  <tr *ngFor="let famille of familles">
                    <td>{{ famille.code }}</td>
                    <td>{{ famille.nom }}</td>

                    <td class="text-center">
                      <button class="btn btn-sm btn-outline-info me-1" (click)="openEditModal(famille)"
                        title="Modifier">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger me-1" (click)="deleteFamille(famille)"
                        title="Supprimer">
                        <i class="fas fa-trash-alt"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-warning" (click)="archiveFamille(famille)" title="Archiver">
                        <i class="fas fa-archive"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>

            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <router-outlet></router-outlet>
</div>
