<div class="container py-4">
  <div class="page-inner">

    <!-- En-tête -->
    <div class="page-header mb-4">
      <h3 class="fw-bold text-dark">Base</h3>
      <ul class="breadcrumbs d-flex align-items-center">
        <li class="nav-home me-2"><a href="#"><i class="fas fa-home text-primary"></i></a></li>
        <li class="separator mx-1 text-muted"><i class="fas fa-chevron-right small"></i></li>
        <li class="nav-item me-2"><a href="#" class="text-muted">Client</a></li>
        <li class="separator mx-1 text-muted"><i class="fas fa-chevron-right small"></i></li>
        <li class="nav-item fw-semibold text-muted">Liste Client</li>
      </ul>
    </div>

    <!-- Bouton Ajouter Client -->
    <div class="row mb-4">
      <div class="col-12 text-end">
        <button
          type="button"
          class="btn btn-gradient px-4 py-2 shadow-sm"
          data-bs-toggle="modal"
          data-bs-target="#addClientModal"
        >
          <i class="fas fa-user-plus me-2"></i> Ajouter un client
        </button>
      </div>
    </div>

    <!-- Modal Formulaire d'ajout client -->
    <div
      class="modal fade"
      id="addClientModal"
      tabindex="-1"
      aria-labelledby="addClientModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-elegant shadow">
          <div class="modal-header modal-header-custom">
            <h5 class="modal-title text-white" id="addClientModalLabel">➕ Nouveau client</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
              <div class="row">
                   <div class="col-md-4 mb-3">
                  <label for="Code" class="form-label">Code</label>
                  <input type="text" class="form-control" id="Code" placeholder="Ex: C0001" formControlName="code"/>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="name" class="form-label">Nom</label>
                  <input type="text" class="form-control" id="name" placeholder="Ex: Nom & Prenom" formControlName="nom" />
                </div>
              </div>
              <div class="modal-footer bg-light border-top">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="submit" class="btn btn-success" [disabled]="clientForm.invalid">✅ Enregistrer</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Barre de recherche et taille page -->
    <div class="row mb-3">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-search"></i></span>
          <input
            type="text"
            class="form-control"
            placeholder="Rechercher par code, nom..."
            [(ngModel)]="searchTerm"
            (keyup.enter)="onSearch()"
          />
          <button class="btn btn-primary" type="button" (click)="onSearch()">
            <i class="fas fa-search"></i> Rechercher
          </button>
        </div>
      </div>
      <div class="col-md-2">
        <select class="form-select" (change)="onPageSizeChange($event)">
          <option [value]="10" [selected]="pageSize === 10">10 par page</option>
          <option [value]="25" [selected]="pageSize === 25">25 par page</option>
          <option [value]="50" [selected]="pageSize === 50">50 par page</option>
          <option [value]="100" [selected]="pageSize === 100">100 par page</option>
        </select>
      </div>
    </div>

    <!-- Tableau Client -->
    <div class="row">
      <div class="col-md-12">
        <div class="card border-0 shadow-sm rounded-3">
         
          <div class="card-body">
            <div class="table-responsive" style="position: relative; min-height: 300px;">
              <!-- Loader overlay -->
              <div
                *ngIf="loading"
                class="text-center my-4"
                style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"
              >
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                  <span class="visually-hidden">Chargement...</span>
                </div>
                <p class="mt-3 mb-0 text-muted fw-semibold">Chargement des clients...</p>
              </div>

              <table
                class="table table-bordered table-striped table-hover"
                width="100%"
                [style.opacity]="loading ? '0.5' : '1'"
              >
                <thead class="table-light">
                  <tr>
                    <th (click)="onSort('code')" class="sortable" style="cursor: pointer; width: 120px;">
                      Code <i class="fas ms-1" [ngClass]="getSortIcon('code')"></i>
                    </th>
                    <th (click)="onSort('nom')" class="sortable" style="cursor: pointer;">
                      Nom <i class="fas ms-1" [ngClass]="getSortIcon('nom')"></i>
                    </th>
                    <th style="width: 150px;" class="text-center">Actions</th>
                  </tr>
                </thead>

                <tbody>
                  <tr *ngIf="!loading && clients.length === 0">
                    <td colspan="3" class="text-center py-4">
                      <p class="text-muted mb-0">Aucun client trouvé</p>
                    </td>
                  </tr>

                  <tr *ngFor="let client of clients">
                    <td>{{ client.code }}</td>
                    <td>{{ client.nom }}</td>

                    <td class="text-center">
                      <button class="btn btn-sm btn-outline-info me-1" (click)="OnEdit(client.part_id)" title="Modifier">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger me-1" (click)="removeClient(client)" title="Supprimer">
                        <i class="fas fa-trash-alt"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>

            </div>

            <!-- Pagination -->
            <div *ngIf="!loading && totalPages > 1" class="d-flex justify-content-between align-items-center mt-3">
              <div class="text-muted">
                Affichage de {{ getDisplayRange() }} sur {{ totalRecords }} clients
              </div>
              <nav>
                <ul class="pagination mb-0">
                  <li class="page-item" [class.disabled]="currentPage === 1">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(1)" [attr.aria-disabled]="currentPage === 1">
                      <i class="fas fa-angle-double-left"></i>
                    </a>
                  </li>
                  <li class="page-item" [class.disabled]="currentPage === 1">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(currentPage - 1)" [attr.aria-disabled]="currentPage === 1">
                      <i class="fas fa-angle-left"></i>
                    </a>
                  </li>
                  <li *ngFor="let page of getPageNumbers()" class="page-item" [class.active]="page === currentPage">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(page)">{{ page }}</a>
                  </li>
                  <li class="page-item" [class.disabled]="currentPage === totalPages">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(currentPage + 1)" [attr.aria-disabled]="currentPage === totalPages">
                      <i class="fas fa-angle-right"></i>
                    </a>
                  </li>
                  <li class="page-item" [class.disabled]="currentPage === totalPages">
                    <a class="page-link" href="javascript:void(0)" (click)="onPageChange(totalPages)" [attr.aria-disabled]="currentPage === totalPages">
                      <i class="fas fa-angle-double-right"></i>
                    </a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <router-outlet></router-outlet>
</div>
