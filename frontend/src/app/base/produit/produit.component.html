<div class="container py-4">
  <div class="page-inner">

    <!-- En-tête -->
    <div class="page-header mb-4">
      <h3 class="fw-bold text-dark">Base</h3>
      <ul class="breadcrumbs d-flex align-items-center">
        <li class="nav-home me-2"><a href="#"><i class="fas fa-home text-primary"></i></a></li>
        <li class="separator mx-1 text-muted"><i class="fas fa-chevron-right small"></i></li>
        <li class="nav-item me-2"><a href="#" class="text-muted">Produit</a></li>
        <li class="separator mx-1 text-muted"><i class="fas fa-chevron-right small"></i></li>
        <li class="nav-item fw-semibold text-muted">Liste Produits</li>
      </ul>
    </div>

    <!-- Bouton Ajouter Client -->
    <div class="row mb-4">
      <div class="col-12 text-end">
        <button type="button" class="btn btn-gradient px-4 py-2 shadow-sm" data-bs-toggle="modal"
          data-bs-target="#addClientModal" (click)="resetForm()">
          <i class="fas fa-user-plus me-2"></i> Ajouter un Produit
        </button>
      </div>
    </div>

    <!-- Modal Formulaire d'ajout client -->
    <div class="modal fade" id="addClientModal" tabindex="-1" aria-labelledby="addClientModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content modal-elegant shadow">
          <div class="modal-header modal-header-custom">
            <h5 class="modal-title text-white" id="addClientModalLabel">
              {{ isEditMode ? '📝 Modifier le Produit' : '➕ Nouveau Produit' }}
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form [formGroup]="produitForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label for="code" class="form-label">Code Produit</label>
                  <input type="text" id="code" class="form-control" formControlName="article_cod"
                    placeholder="Ex: C0001" />
                </div>

                <div class="col-md-4 mb-3">
                  <label for="designation" class="form-label">Désignation</label>
                  <input type="text" id="designation" class="form-control" formControlName="article_nom"
                    placeholder="Ex: Produit 1" />
                </div>

                <div class="col-md-4 mb-3">
                  <label for="prix" class="form-label">Prix</label>
                  <input type="number" id="prix" class="form-control" formControlName="prix_quantite"
                    placeholder="Ex: 0.00 dh" />
                </div>

                <div class="col-md-4 mb-3">
                  <label for="unite_id" class="form-label">Famille</label>
                  <select id="unite_id" class="form-select" formControlName="famille">
                    <option disabled selected>Choisir une Famille</option>
                    <option *ngFor="let f of familles" [value]="f.id">{{ f.nom }}</option>
                  </select>
                </div>

                <div class="col-md-4 mb-3">
                  <label for="unite_id" class="form-label">Unité</label>
                  <select id="unite_id" class="form-select" formControlName="unite_id">
                    <option disabled selected>Choisir une Unité</option>
                    <option *ngFor="let u of unites" [value]="u.id">{{ u.nom }}</option>
                  </select>
                </div>

                <!-- <div class="col-12 mt-3">
                  <button type="submit" class="btn btn-primary" [disabled]="!produitForm.valid">Enregistrer</button>
                </div>

                <div *ngIf="successMessage" class="alert alert-success mt-3">
                  {{ successMessage }}
                </div> -->
              </div>
              <div class="modal-footer bg-light border-top">
                <button type="submit" class="btn btn-info" [disabled]="!produitForm.valid">
                  {{ isEditMode ? '💾 Enregistrer les modifications' : '✅ Enregistrer' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Tableau Client -->
    <div class="row">
      <div class="col-md-12">
        <div class="card border-0 shadow-sm rounded-3">

          <div class="card-body">
            <div class="table-responsive">
              <div *ngIf="loading" class="text-center my-4">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Chargement...</span>
                </div>
              </div>

              <table *ngIf="!loading" id="clientTable" class="display table table-bordered table-striped" width="100%">
                <thead>
                  <tr>
                    <th style="width: 70px;">Produit Code</th>
                    <th style="width: 130px;">Désignation</th>
                    <th>Famille</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody>
                  <tr *ngFor="let produit of produits">
                    <td>{{ produit.article_cod }}</td>
                    <td>{{ produit.article_nom }}</td>
                    <td>{{ produit.famille }}</td>
                    <td>{{ produit.prix_quantite }}</td>
                    <td>{{ produit.taxe_id }}</td>

                    <td class="text-center">
                      <button class="btn btn-sm btn-outline-info me-1" (click)="onEdit(produit)">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger me-1" (click)="onDelete(produit.article_id)">
                        <i class="fas fa-trash-alt"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-warning">
                        <i class="fas fa-archive"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>

            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <router-outlet></router-outlet>
</div>
