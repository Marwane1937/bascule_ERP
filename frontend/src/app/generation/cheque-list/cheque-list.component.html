<div class="container mt-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
      <h4 class="mb-0 fw-light"><i class="fas fa-list me-2"></i> Règlements par Chèque / Effet</h4>
      <div>
        <!-- Bouton Nouveau Interne -->
        <button class="btn btn-light text-primary btn-sm me-2 fw-bold shadow-sm" [routerLink]="['/generation/editor']">
          <i class="fas fa-plus me-1"></i> Nouveau Chèque
        </button>

        <button class="btn btn-warning text-dark btn-sm me-2 fw-bold shadow-sm" [routerLink]="['/generation/editor']">
          <i class="fas fa-pen-fancy me-1"></i> Mode Éditeur Libre
        </button>
        <button class="btn btn-light btn-sm" (click)="loadReglements()">
          <i class="fas fa-sync"></i>
        </button>
      </div>
    </div>

    <div class="card-body bg-light">
      <div *ngIf="loading" class="text-center p-5">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p class="text-muted">Chargement des règlements...</p>
      </div>

      <div *ngIf="!loading && reglements.length === 0" class="text-center p-5 bg-white rounded border border-dashed">
        <div class="mb-3 text-muted">
          <i class="fas fa-folder-open fa-3x opacity-25"></i>
        </div>
        <h5 class="text-muted mb-3">Aucun règlement en attente</h5>
        <button class="btn btn-primary btn-lg rounded-pill px-4 shadow-sm" [routerLink]="['/generation/editor']">
          <i class="fas fa-plus-circle me-2"></i> Créer Nouveau Chèque
        </button>
      </div>

      <div class="table-responsive bg-white rounded shadow-sm" *ngIf="!loading && reglements.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light text-secondary small text-uppercase">
            <tr>
              <th class="py-3 ps-3">Numéro</th>
              <th>Date</th>
              <th>Émetteur</th>
              <th>Banque</th>
              <th class="text-end">Montant</th>
              <th class="text-center pe-3">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of reglements">
              <td class="ps-3 fw-bold text-primary">{{ r.numero }}</td>
              <td>{{ r.date | date:'dd/MM/yyyy' }}</td>
              <td>{{ r.beneficiaire || r.client }}</td>
              <td><span class="badge bg-light text-dark border">{{ r.banque_nom || '-' }}</span></td>
              <td class="text-end fw-bold">{{ r.montant | number:'1.2-2' }} €</td>
              <td class="text-center pe-3">
                <button class="btn btn-sm btn-outline-primary rounded-pill px-3"
                  [routerLink]="['/generation/edit', r.regle_id]">
                  <i class="fas fa-print me-1"></i> Imprimer
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
